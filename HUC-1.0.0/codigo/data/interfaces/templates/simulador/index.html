{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Simuladores HUC</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    .hint {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.1rem;
      height: 1.1rem;
      margin-left: 0.35rem;
      border-radius: 50%;
      border: 1px solid currentColor;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: help;
      vertical-align: middle;
    }
    .hint:focus { outline: 2px solid #246; outline-offset: 2px; }
    .campo-auto { display: block; margin: 0.5rem 0; }
    .fila-botones { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.75rem 0; }
  </style>
</head>
<body>
  <main class="contenido">
    <h1>Simuladores</h1>
    <p class="leyenda">Puerto de servicio: 8001 (Data). Los cambios son temporales: no modifican los archivos del dataset.</p>
    <form id="acceso" class="tarjeta" {% if autenticado %}hidden{% endif %}>
      <label>Usuario <input id="usuario" autocomplete="username" value="operador"></label>
      <label>Clave <input id="clave" type="password" autocomplete="current-password"></label>
      <button type="submit">Entrar</button>
      <p id="acceso-estado" class="leyenda"></p>
    </form>
    <section id="panel" class="instrumento" {% if not autenticado %}hidden{% endif %}>
      <div class="tarjeta fila-pozo">
        <label for="pozo">Pozo</label>
        <select id="pozo">
          {% for pozo in pozos %}
            <option value="{{ pozo.pozo_id }}" {% if not pozo.evaluable %}disabled{% endif %}>{{ pozo.pozo_id }}{% if not pozo.evaluable %} · no disponible{% endif %}</option>
          {% endfor %}
        </select>
        <button type="button" id="restaurar-todo">Restaurar valores</button>
        <button type="button" id="cerrar-sesion">Cerrar sesión</button>
      </div>
      <p id="publicacion" class="leyenda">Sin publicar.</p>
      <div id="mandos" class="rejilla-mandos" aria-label="Mandos de simulación"></div>
      <div class="fila-botones">
        <button type="button" id="aplicar">Aplicar escenario</button>
        <span class="hint" tabindex="0" title="Publica una vez los valores actuales del pozo hacia Proceso. No inicia la secuencia automática." aria-label="Ayuda de Aplicar escenario">i</span>
      </div>
      <fieldset>
        <legend>Secuencia automática</legend>
        <label class="campo-auto">Intervalo (s)
          <input id="intervalo" type="number" min="0.2" step="0.1" value="2">
          <span class="hint" tabindex="0" title="Segundos entre cada actualización publicada. Un intervalo menor genera cambios más frecuentes. Mínimo 0,2 s." aria-label="Ayuda de intervalo">i</span>
        </label>
        <label class="campo-auto">Duración (s)
          <input id="duracion" type="number" min="1" step="1" value="30">
          <span class="hint" tabindex="0" title="Segundos durante los cuales se generan cambios. Al finalizar, los últimos valores permanecen activos; no se restauran solos." aria-label="Ayuda de duración">i</span>
        </label>
        <label class="campo-auto">Semilla
          <input id="semilla" type="number" step="1" value="1">
          <span class="hint" tabindex="0" title="Inicializa el generador aleatorio. La misma semilla, con el mismo intervalo y duración, reproduce la misma secuencia de variaciones." aria-label="Ayuda de semilla">i</span>
        </label>
        <div class="fila-botones">
          <button type="button" id="auto-iniciar">Iniciar secuencia</button>
          <span class="hint" tabindex="0" title="Arranca la secuencia automática con intervalo, duración y semilla. Distinto de Aplicar escenario, que solo publica el valor actual una vez." aria-label="Ayuda de Iniciar secuencia">i</span>
          <button type="button" id="auto-detener">Detener</button>
        </div>
        <p id="fase" class="leyenda"></p>
      </fieldset>
    </section>
  </main>
  <script src="{% static 'js/mandos.js' %}"></script>
  <script src="{% static 'js/simulador.js' %}"></script>
</body>
</html>
